{% extends "base.html" %}{% block body %}
<h1>Goal &amp; schedule</h1>
<form method="post" action="/setup" class="card">
  <label>Name <input name="name" value="{{ p.name if p }}"></label>
  <label>Units
    <select name="units"><option value="km" {{ 'selected' if p and p.units=='km' }}>Kilometres</option><option value="mi" {{ 'selected' if p and p.units=='mi' }}>Miles</option></select>
    <span class="mut sm">(mileage fields below use this unit)</span></label>

  <label>Goal race</label>
  <div class="row">
    <select name="goal_preset">
      {% for k in presets %}<option {{ 'selected' if p and p.goal_label==k }}>{{ k }}</option>{% endfor %}
      <option value="" {{ 'selected' if p and p.goal_label not in presets }}>Custom distance…</option>
    </select>
    <input name="goal_custom" type="number" step="0.1" placeholder="custom distance" style="width:9em">
    <input name="race_date" type="date" required value="{{ p.race_date if p }}">
  </div>
  <label>Target finish time <span class="mut sm">(optional, h:mm:ss)</span> <input name="goal_time" placeholder="1:45:00" value="{% if p and p.goal_time_s %}{{ '%d:%02d:%02d' % (p.goal_time_s//3600, p.goal_time_s%3600//60, p.goal_time_s%60) }}{% endif %}"></label>

  <label>Current weekly mileage <input name="baseline" type="number" step="0.5" min="0" value="{{ (p.baseline_km / (1.609344 if p.units=='mi' else 1))|round(1) if p else 0 }}" style="width:7em">
    <span class="mut sm">(used until Strava history is available)</span></label>
  <label>Experience
    <select name="experience">{% for e in ['beginner','intermediate','advanced'] %}<option {{ 'selected' if (p.experience if p else 'intermediate')==e }}>{{ e }}</option>{% endfor %}</select></label>

  <label>When can you run?</label>
  <table><tr><th>Day</th><th>Available</th><th>Minutes</th><th>Usual time</th></tr>
  {% for d in days %}{% set a = p.availability[d] if p else None %}
  <tr><td>{{ d|title }}</td>
    <td><input type="checkbox" name="av_{{ d }}" {{ 'checked' if a and a.available }}></td>
    <td><input type="number" name="min_{{ d }}" min="0" max="300" step="5" value="{{ a.minutes if a else 45 }}" style="width:6em"></td>
    <td><input name="time_{{ d }}" placeholder="6:00am" value="{{ a.time if a }}" style="width:7em"></td></tr>
  {% endfor %}</table>
  <label>Long-run day <select name="long_run_day">{% for d in days %}<option value="{{ d }}" {{ 'selected' if (p.long_run_day if p else 'sun')==d }}>{{ d|title }}</option>{% endfor %}</select></label>
  <label>Anything the coach should know? <span class="mut sm">(injuries, hills, treadmill-only days, preferences)</span>
    <textarea name="notes" rows="3">{{ p.notes if p }}</textarea></label>
  <div style="margin-top:16px"><button>Save</button></div>
</form>
{% endblock %}
